<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackwing — Crow Hangar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c10;
      color: #c8d0dc;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(8, 10, 14, 0.72);
      border: 1px solid rgba(120, 140, 180, 0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      min-width: 240px;
      backdrop-filter: blur(6px);
    }
    #hud h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e8ecf4;
      margin-bottom: 4px;
    }
    #hud .mode {
      color: #7eb8ff;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    #hud .stat { color: #9aa8bc; }
    #hud .warn { color: #ffb347; }
    #hud .critical { color: #ff6b6b; font-weight: 600; }
    #hud .low-energy { color: #c9a227; }
    #debug-panel {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      background: rgba(8, 10, 14, 0.82);
      border: 1px solid rgba(120, 140, 180, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.45;
      color: #8aa0b8;
      max-width: 320px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Blackwing — Crow Hangar</h1>
    <div class="mode" id="phase">connecting…</div>
    <div class="stat" id="controls">—</div>
    <div class="stat" id="flight-status">—</div>
    <div class="stat" id="telemetry">—</div>
  </div>
  <div id="debug-panel"></div>
  <script src="hangar_hud.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="blackwing.js"></script>
</body>
</html>
